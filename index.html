<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="موسیقی جاودان">
<link rel="manifest" href="manifest.json">
<title>موسیقی جاودان</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #181818;
    --surface2: #222222;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #777;
    --accent: #c9a0ff;
    --accent-d: #3B1F6B;
    --accent-h: #FFB3D1;
    --accent-hd: #6B1A3A;
    --radius: 14px;
    --pad: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- NAV ---- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(13,13,13,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px var(--pad);
    height: 56px;
  }
  .nav-title { font-size: 16px; font-weight: 500; }
  .nav-back { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 4px 8px; display: none; }
  .nav-back.visible { display: block; }

  /* ---- PAGES ---- */
  .page { display: none; padding-top: 68px; padding-bottom: 24px; min-height: 100vh; }
  .page.active { display: block; }

  /* ---- HOME ---- */
  .home-header {
    text-align: center; padding: 32px var(--pad) 24px;
  }
  .home-header h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  .home-header p { font-size: 14px; color: var(--muted); }

  .artist-cards {
    display: flex; flex-direction: column; gap: 12px;
    padding: 0 var(--pad);
  }
  .artist-card {
    border-radius: var(--radius);
    padding: 24px 20px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    position: relative; overflow: hidden;
  }
  .artist-card:active { transform: scale(0.98); opacity: 0.9; }
  .artist-card-d { background: linear-gradient(135deg, #1a0a2e 0%, #2d1060 100%); border: 1px solid #3B1F6B; }
  .artist-card-h { background: linear-gradient(135deg, #1a0a18 0%, #501030 100%); border: 1px solid #6B1A3A; }
  .card-label { font-size: 11px; font-weight: 500; letter-spacing: 2px; opacity: 0.7; margin-bottom: 6px; text-transform: uppercase; }
  .card-name { font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  .card-title { font-size: 13px; opacity: 0.7; margin-bottom: 16px; }
  .card-stats { display: flex; gap: 20px; }
  .card-stat { font-size: 12px; opacity: 0.8; }
  .card-stat span { font-weight: 600; font-size: 16px; display: block; margin-bottom: 2px; }
  .card-deco {
    position: absolute; left: -20px; top: -20px;
    width: 120px; height: 120px; border-radius: 50%;
    opacity: 0.06;
  }
  .card-deco-d { background: #c9a0ff; }
  .card-deco-h { background: #ffb3d1; }

  /* ---- ARTIST PAGE ---- */
  .artist-hero {
    padding: 20px var(--pad) 16px;
    border-bottom: 1px solid var(--border);
  }
  .artist-hero-name { font-size: 24px; font-weight: 600; margin-bottom: 2px; }
  .artist-hero-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .artist-bio { font-size: 13px; line-height: 1.8; color: #aaa; margin-bottom: 16px; }
  .artist-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    border: 1px solid; font-weight: 500;
  }

  .section-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    position: sticky; top: 56px; background: var(--bg); z-index: 10;
  }
  .sec-tab {
    flex: 1; padding: 14px; text-align: center;
    font-size: 14px; font-weight: 500; color: var(--muted);
    cursor: pointer; border: none; background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .sec-tab.active { color: var(--text); }

  .section-panel { display: none; }
  .section-panel.active { display: block; }

  .list-section { padding: 8px 0; }
  .list-header {
    font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase;
    padding: 16px var(--pad) 8px;
  }

  .item-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px var(--pad);
    cursor: pointer; transition: background 0.1s;
    border-bottom: 1px solid var(--border);
  }
  .item-row:active { background: var(--surface); }
  .item-num {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-title { font-size: 15px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-arrow { color: var(--muted); font-size: 16px; flex-shrink: 0; }

  .album-badge {
    display: inline-block; font-size: 10px; padding: 2px 7px;
    border-radius: 10px; margin-right: 6px; vertical-align: middle;
    font-weight: 500;
  }

  /* ---- SONG DETAIL PAGE ---- */
  .song-hero {
    padding: 24px var(--pad) 20px;
    border-bottom: 1px solid var(--border);
  }
  .song-hero-title { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .song-hero-artist { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .song-nav-tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none;
  }
  .song-nav-tabs::-webkit-scrollbar { display: none; }
  .song-tab {
    flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: none;
    color: var(--muted); transition: all 0.15s;
  }
  .song-tab.active { color: var(--bg); }

  .song-panel { display: none; padding: var(--pad); }
  .song-panel.active { display: block; }

  .info-grid { display: flex; flex-direction: column; gap: 1px; }
  .info-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 12px; color: var(--muted); min-width: 100px; flex-shrink: 0; padding-top: 1px; }
  .info-val { font-size: 14px; color: var(--text); flex: 1; line-height: 1.6; }
  .info-val.empty { color: var(--muted); font-style: italic; font-size: 13px; }

  .story-text { font-size: 15px; line-height: 2; color: #ccc; }
  .no-content { text-align: center; padding: 48px 0; color: var(--muted); font-size: 14px; }
  .no-content-icon { font-size: 40px; margin-bottom: 12px; }

  .lyrics-text {
    font-size: 15px; line-height: 2.2; color: #ccc;
    white-space: pre-wrap; text-align: center;
    font-weight: 300;
  }

  .sheet-music { text-align: center; padding: 24px 0; color: var(--muted); font-size: 14px; }

  /* ---- ALBUM DETAIL ---- */
  .album-hero { padding: 20px var(--pad); border-bottom: 1px solid var(--border); }
  .album-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .album-year { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .album-info-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 13px; }
  .album-info-label { color: var(--muted); min-width: 80px; }
  .album-info-val { color: var(--text); }
  .album-story { font-size: 13px; line-height: 1.8; color: #aaa; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

  /* ---- UTILS ---- */
  .fade-in { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .empty-badge {
    display: inline-block; font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin-right: 4px;
  }
</style>
</head>

let currentArtist = null;
let history = ['home'];
let currentSongTabs = ['اطلاعات','داستان','متن','نت'];

function val(v) { return v ? `<span class="info-val">${v}</span>` : `<span class="info-val empty">—</span>`; }

function openArtist(id) {
  currentArtist = DATA[id];
  const a = currentArtist;
  const c = a.colorLight;
  const cd = a.colorDark;

  document.getElementById('artist-hero').innerHTML = `
    <div style="font-size:11px;letter-spacing:2px;color:${c};text-transform:uppercase;margin-bottom:6px;font-weight:600">${a.title}</div>
    <div class="artist-hero-name">${a.name}</div>
    <div class="artist-hero-sub">${a.fullName} · متولد ${a.born}${a.died ? ' · درگذشته '+a.died : ''}</div>
    <div class="artist-bio">${a.bio}</div>
    <div class="artist-tags">
      <span class="tag" style="color:${c};border-color:${a.color}">${a.voiceType}</span>
      <span class="tag" style="color:${c};border-color:${a.color}">${a.birthPlace}</span>
      ${a.died ? `<span class="tag" style="color:var(--muted);border-color:var(--border)">درگذشته</span>` : ''}
    </div>
  `;

  // color tabs
  document.querySelectorAll('.sec-tab').forEach(t => t.style.borderBottomColor = '');
  document.getElementById('tab-albums').style.setProperty('--tab-active', c);

  // Albums
  let albHTML = '<div class="list-section">';
  a.albums.forEach((alb,i) => {
    const hasMeta = alb.composer || alb.poet;
    albHTML += `<div class="item-row" onclick="openAlbum('${alb.id}')">
      <div class="item-num" style="background:${cd};color:${c}">${i+1}</div>
      <div class="item-info">
        <div class="item-title">${alb.title}</div>
        <div class="item-sub">${alb.year}${hasMeta ? ' · '+[alb.poet,alb.composer].filter(Boolean).join(' · ') : ''}</div>
      </div>
      <div class="item-arrow">›</div>
    </div>`;
  });
  albHTML += '</div>';
  document.getElementById('panel-albums').innerHTML = albHTML;

  // Singles
  let sinHTML = '<div class="list-section">';
  a.singles.forEach((s,i) => {
    const hasMeta = s.composer || s.poet;
    sinHTML += `<div class="item-row" onclick="openSong('${s.id}', null)">
      <div class="item-num" style="background:${cd};color:${c}">${i+1}</div>
      <div class="item-info">
        <div class="item-title">${s.title}</div>
        <div class="item-sub">${s.year}${hasMeta ? ' · '+[s.poet,s.composer].filter(Boolean).join(' · ') : ''}</div>
      </div>
      <div class="item-arrow">›</div>
    </div>`;
  });
  sinHTML += '</div>';
  document.getElementById('panel-singles').innerHTML = sinHTML;

  switchSection('albums');
  navigate('artist', a.name);
}

function openAlbum(albumId) {
  const a = currentArtist;
  const alb = a.albums.find(x => x.id === albumId);
  const c = a.colorLight, cd = a.colorDark;

  document.getElementById('album-hero').innerHTML = `
    <div style="font-size:11px;color:${c};font-weight:600;letter-spacing:1px;margin-bottom:4px">آلبوم</div>
    <div class="album-title">${alb.title}</div>
    <div class="album-year">${alb.year}</div>
    ${alb.poet ? `<div class="album-info-row"><span class="album-info-label">شاعر</span><span class="album-info-val">${alb.poet}</span></div>` : ''}
    ${alb.composer ? `<div class="album-info-row"><span class="album-info-label">آهنگساز</span><span class="album-info-val">${alb.composer}</span></div>` : ''}
    ${alb.arranger ? `<div class="album-info-row"><span class="album-info-label">تنظیم‌کننده</span><span class="album-info-val">${alb.arranger}</span></div>` : ''}
    ${alb.director ? `<div class="album-info-row"><span class="album-info-label">کارگردان</span><span class="album-info-val">${alb.director}</span></div>` : ''}
    ${alb.story ? `<div class="album-story">${alb.story}</div>` : ''}
  `;

  let songsHTML = '';
  alb.songs.forEach((s,i) => {
    songsHTML += `<div class="item-row" onclick="openSong('${s.id}', '${albumId}')">
      <div class="item-num" style="background:${cd};color:${c}">${i+1}</div>
      <div class="item-info">
        <div class="item-title">${s.title}</div>
        <div class="item-sub">${s.year}${s.poet ? ' · '+s.poet : ''}</div>
      </div>
      <div class="item-arrow">›</div>
    </div>`;
  });
  document.getElementById('album-songs').innerHTML = songsHTML;

  navigate('album', alb.title);
}

function openSong(songId, albumId) {
  const a = currentArtist;
  const c = a.colorLight, cd = a.colorDark;
  let song = null;

  if (albumId) {
    const alb = a.albums.find(x => x.id === albumId);
    song = alb.songs.find(x => x.id === songId);
  } else {
    song = a.singles.find(x => x.id === songId);
  }
  if (!song) return;

  document.getElementById('song-hero').innerHTML = `
    <div style="font-size:11px;color:${c};font-weight:600;letter-spacing:1px;margin-bottom:4px">${a.name}</div>
    <div class="song-hero-title">${song.title}</div>
    <div class="song-hero-artist">${song.year}</div>
    <div class="song-nav-tabs">
      <button class="song-tab active" onclick="switchSongTab(0,this)" style="background:${c};border-color:${c};color:#000">اطلاعات</button>
      <button class="song-tab" onclick="switchSongTab(1,this)">داستان</button>
      <button class="song-tab" onclick="switchSongTab(2,this)">متن ترانه</button>
      <button class="song-tab" onclick="switchSongTab(3,this)">نت</button>
    </div>
  `;

  // Info panel
  document.getElementById('sp-info').innerHTML = `
    <div class="info-grid">
      <div class="info-row"><span class="info-label">خواننده</span>${val(a.fullName)}</div>
      <div class="info-row"><span class="info-label">سال</span>${val(song.year)}</div>
      <div class="info-row"><span class="info-label">شاعر / ترانه‌سرا</span>${val(song.poet)}</div>
      <div class="info-row"><span class="info-label">آهنگساز</span>${val(song.composer)}</div>
      <div class="info-row"><span class="info-label">تنظیم‌کننده</span>${val(song.arranger)}</div>
      <div class="info-row"><span class="info-label">کارگردان</span>${val(song.director)}</div>
    </div>
  `;

  // Story panel
  document.getElementById('sp-story').innerHTML = song.story
    ? `<p class="story-text">${song.story}</p>`
    : `<div class="no-content"><div class="no-content-icon">📖</div>داستانی برای این ترانه ثبت نشده</div>`;

  // Lyrics panel
  document.getElementById('sp-lyrics').innerHTML = song.lyrics
    ? `<pre class="lyrics-text">${song.lyrics}</pre>`
    : `<div class="no-content"><div class="no-content-icon">🎵</div>متن ترانه هنوز اضافه نشده</div>`;

  // Sheet music
  document.getElementById('sp-sheet').innerHTML = `
    <div class="no-content"><div class="no-content-icon">🎼</div>نت این ترانه هنوز اضافه نشده</div>
  `;

  // reset tabs
  document.querySelectorAll('.song-tab').forEach(t => {
    t.classList.remove('active');
    t.style.background = '';
    t.style.borderColor = '';
    t.style.color = '';
  });
  const firstTab = document.querySelector('.song-tab');
  if (firstTab) {
    firstTab.classList.add('active');
    firstTab.style.background = c;
    firstTab.style.borderColor = c;
    firstTab.style.color = '#000';
  }
  ['sp-info','sp-story','sp-lyrics','sp-sheet'].forEach((id,i) => {
    document.getElementById(id).classList.toggle('active', i===0);
  });

  navigate('song', song.title);
}

function switchSongTab(idx, btn) {
  const a = currentArtist;
  const c = a ? a.colorLight : '#c9a0ff';
  document.querySelectorAll('.song-tab').forEach(t => {
    t.classList.remove('active');
    t.style.background = '';
    t.style.borderColor = '';
    t.style.color = '';
  });
  btn.classList.add('active');
  btn.style.background = c;
  btn.style.borderColor = c;
  btn.style.color = '#000';
  ['sp-info','sp-story','sp-lyrics','sp-sheet'].forEach((id,i) => {
    document.getElementById(id).classList.toggle('active', i===idx);
  });
}

function switchSection(section) {
  ['albums','singles'].forEach(s => {
    document.getElementById('tab-'+s).classList.toggle('active', s===section);
    document.getElementById('panel-'+s).classList.toggle('active', s===section);
  });
  const c = currentArtist ? currentArtist.colorLight : '#fff';
  document.getElementById('tab-'+section).style.borderBottomColor = c;
  document.getElementById('tab-'+section === 'tab-albums' ? 'tab-singles' : 'tab-albums').style.borderBottomColor = 'transparent';
}

function navigate(page, title) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-'+page);
  target.classList.add('active');
  target.classList.remove('fade-in');
  void target.offsetWidth;
  target.classList.add('fade-in');
  document.getElementById('navTitle').textContent = title || 'موسیقی جاودان';
  document.getElementById('navBack').classList.add('visible');
  history.push(page);
  window.scrollTo(0,0);
}

function goBack() {
  history.pop();
  const prev = history[history.length-1];
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+prev).classList.add('active');
  if (prev === 'home') {
    document.getElementById('navTitle').textContent = 'موسیقی جاودان';
    document.getElementById('navBack').classList.remove('visible');
  } else if (prev === 'artist') {
    document.getElementById('navTitle').textContent = currentArtist ? currentArtist.name : '';
  } else if (prev === 'album') {
    document.getElementById('navTitle').textContent = 'آلبوم';
  }
  window.scrollTo(0,0);
}

// Init stats
document.getElementById('stat-d-alb').textContent = DATA.dariush.albums.length;
document.getElementById('stat-d-s').textContent = DATA.dariush.singles.length;
document.getElementById('stat-h-alb').textContent = DATA.hayedeh.albums.length;
document.getElementById('stat-h-s').textContent = DATA.hayedeh.singles.length;

// PWA service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
