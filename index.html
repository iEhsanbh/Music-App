<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>موسیقی جاودان</title>
<style>
:root{--bg:#0a0a0a;--s1:#161616;--s2:#1e1e1e;--bd:#2a2a2a;--tx:#f0f0f0;--mt:#666;--r:12px;--p:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;align-items:center;height:52px;padding:0 var(--p);gap:8px}
.nav-back{background:none;border:none;color:var(--tx);font-size:22px;cursor:pointer;padding:4px 8px;display:none;flex-shrink:0}
.nav-back.show{display:block}
.nav-title{font-size:15px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{display:none;padding-top:60px;min-height:100vh}
.page.active{display:block}
/* HOME */
.home-hero{text-align:center;padding:28px var(--p) 16px}
.home-hero h1{font-size:22px;font-weight:600;margin-bottom:4px}
.home-hero p{font-size:12px;color:var(--mt)}
.artist-list{padding:0 var(--p);display:flex;flex-direction:column;gap:10px}
.ac{border-radius:var(--r);padding:18px;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
.ac:active{transform:scale(.98)}
.ac-deco{position:absolute;left:-15px;top:-15px;width:90px;height:90px;border-radius:50%;opacity:.07}
.ac-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-bottom:3px}
.ac-name{font-size:24px;font-weight:700;margin-bottom:2px}
.ac-sub{font-size:11px;opacity:.6;margin-bottom:12px}
.ac-stats{display:flex;gap:14px}
.ac-stat span{font-size:17px;font-weight:600;display:block}
.ac-stat p{font-size:10px;opacity:.7}
/* ARTIST */
.ah{padding:16px var(--p) 12px;border-bottom:1px solid var(--bd)}
.ah-tag{font-size:10px;letter-spacing:2px;font-weight:600;text-transform:uppercase;margin-bottom:3px}
.ah-name{font-size:20px;font-weight:600;margin-bottom:2px}
.ah-sub{font-size:11px;color:var(--mt);margin-bottom:8px}
.ah-bio{font-size:12px;line-height:1.8;color:#aaa}
/* TABS */
.stabs{display:flex;border-bottom:1px solid var(--bd);position:sticky;top:52px;background:var(--bg);z-index:10;overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:11px 14px;font-size:12px;font-weight:500;color:var(--mt);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.stab.active{color:var(--tx)}
.spanel{display:none}
.spanel.active{display:block}
/* LIST */
.lbl{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--mt);text-transform:uppercase;padding:12px var(--p) 5px}
.row{display:flex;align-items:center;gap:10px;padding:10px var(--p);border-bottom:1px solid var(--bd);cursor:pointer;transition:background .1s}
.row:active{background:var(--s1)}
.rnum{width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.rinfo{flex:1;min-width:0}
.rtitle{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.rsub{font-size:11px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rarr{color:var(--mt);font-size:15px;flex-shrink:0}
.jbadge{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--s2);border:1px solid var(--bd);color:var(--mt);display:inline-block;margin-top:2px}
.nbadge{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--mt);display:inline-block;margin-top:2px}
/* ALBUM */
.albh{padding:16px var(--p);border-bottom:1px solid var(--bd)}
.alb-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:3px}
.alb-title{font-size:18px;font-weight:600;margin-bottom:2px}
.alb-year{font-size:11px;color:var(--mt);margin-bottom:8px}
.alb-mr{font-size:12px;margin-bottom:3px;display:flex;gap:6px}
.alb-ml{color:var(--mt);min-width:75px;flex-shrink:0}
.alb-story{font-size:12px;line-height:1.8;color:#aaa;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
/* SONG */
.sng-hero{padding:16px var(--p) 10px;border-bottom:1px solid var(--bd)}
.sng-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:3px}
.sng-title{font-size:18px;font-weight:600;margin-bottom:2px}
.sng-year{font-size:11px;color:var(--mt);margin-bottom:12px}
.stabs2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.stabs2::-webkit-scrollbar{display:none}
.stab2{flex-shrink:0;padding:6px 12px;border-radius:18px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:none;color:var(--mt);transition:all .15s}
.stab2.active{color:#000}
.spanel2{display:none;padding:var(--p)}
.spanel2.active{display:block}
.irow{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:12px}
.irow:last-child{border:none}
.ilbl{color:var(--mt);min-width:95px;flex-shrink:0}
.ival{color:var(--tx)}
.iempty{color:var(--mt);font-style:italic}
.story{font-size:13px;line-height:2;color:#ccc}
.lyrics{font-size:13px;line-height:2.3;color:#ccc;text-align:center;white-space:pre-wrap}
.nodata{text-align:center;padding:40px 0;color:var(--mt)}
.nodata-ic{font-size:34px;margin-bottom:8px}
/* TOP20 */
.t20row{display:flex;align-items:center;gap:10px;padding:10px var(--p);border-bottom:1px solid var(--bd)}
.t20rank{width:24px;text-align:center;font-size:12px;font-weight:600;color:var(--mt);flex-shrink:0}
.gold{color:#FFD700}.silver{color:#C0C0C0}.bronze{color:#CD7F32}
.fade{animation:fi .18s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

function v(x){return x||'<span class="iempty">—</span>';}

// HOME
function renderHome(){
  document.getElementById('al').innerHTML=Object.values(A).map(a=>{
    const data=getData(a.id);

    const sngs=(data.singles||[]).length;
    return `<div class="ac" style="background:linear-gradient(135deg,${a.d} 0%,${a.c}88 100%);border:1px solid ${a.c}55" onclick="openArtist('${a.id}')">

// ARTIST
function openArtist(id){
  cur.artist=A[id];
  const a=cur.artist;
  const data=getData(id);
  document.getElementById('ah').innerHTML=`
    <div class="ah-tag" style="color:${a.l}">${a.title}</div>
    <div class="ah-name">${a.name}</div>
    <div class="ah-sub">${a.full} · متولد ${a.born}${a.died?' · درگذشته '+a.died:''}</div>
    <div class="ah-bio">${a.bio}</div>`;
  const secs=a.secs;
  document.getElementById('stabs').innerHTML=secs.map((s,i)=>`<button class="stab${i===0?' active':''}" onclick="switchSec(${i})" id="stab${i}" style="${i===0?'border-bottom-color:'+a.l+';color:'+a.l:''}">${s}</button>`).join('');
  document.getElementById('spanels').innerHTML=secs.map((_,i)=>`<div class="spanel${i===0?' active':''}" id="sp${i}"></div>`).join('');
  // fill panels
  if(id==='dariush'){
    fillList('sp0',data.albums,a,'alb');
    fillList('sp1',data.compilations,a,'alb');
    fillList('sp2',data.concerts,a,'alb');
    fillFilms('sp3',data.films,a);
    fillSingles('sp4',data.singles,a);
  }else{
    fillList('sp0',data.albums,a,'alb');
    fillList('sp1',data.compilations,a,'alb');
    fillList('sp2',data.concerts,a,'alb');
    fillFilms('sp3',data.films,a);
    fillSingles('sp4',data.singles,a);
    fillTop20('sp5',data.top20,a);
  }
  nav('artist',a.name);
}

function fillList(pid,items,a,type){
  const el=document.getElementById(pid);
  if(!items||!items.length){el.innerHTML='<div class="nodata"><div class="nodata-ic">📂</div>موردی ثبت نشده</div>';return;}
  el.innerHTML=`<div class="lbl">(${items.length})</div>`+items.map((item,i)=>`
    <div class="row" onclick="openAlbum('${item.id}')">
      <div class="rnum" style="background:${a.d};color:${a.l}">${i+1}</div>
      <div class="rinfo">
        <div class="rtitle">${item.t}</div>
        <div class="rsub">${[item.y,item.j].filter(Boolean).join(' · ')||'—'}</div>
      </div>
      <div class="rarr">›</div>
    </div>`).join('');
}

function switchSec(i){
  const a=cur.artist;
  document.querySelectorAll('.stab').forEach((t,j)=>{t.classList.toggle('active',j===i);t.style.borderBottomColor=j===i?a.l:'transparent';t.style.color=j===i?a.l:'';});
  document.querySelectorAll('.spanel').forEach((p,j)=>p.classList.toggle('active',j===i));
}

// ALBUM
function openAlbum(id){
  const data=getData(cur.artist.id);
  const all=[...(data.albums||[]),...(data.compilations||[]),...(data.concerts||[])];
  const alb=all.find(x=>x.id===id);
  if(!alb)return;
  cur.album=alb;
  const a=cur.artist;
  document.getElementById('albh').innerHTML=`
    <div class="alb-tag" style="color:${a.l}">آلبوم · ${a.name}</div>
    <div class="alb-title">${alb.t}</div>
    <div class="alb-year">${alb.y||''}${alb.j?' · '+alb.j:''}</div>
    ${alb.story?`<div class="alb-story">${alb.story}</div>`:''}`;
  document.getElementById('albsongs').innerHTML=(alb.s||[]).map((s,i)=>`
    <div class="row" onclick="openSong('${id}',${i})">
      <div class="rnum" style="background:${a.d};color:${a.l}">${i+1}</div>
      <div class="rinfo">
        <div class="rtitle">${s.t}</div>
        <div class="rsub">${[s.y,s.p].filter(Boolean).join(' · ')||'—'}</div>
        ${s.n?`<div class="nbadge">${s.n}</div>`:''}
      </div>
      <div class="rarr">›</div>
    </div>`).join('')||'<div class="nodata"><div class="nodata-ic">🎵</div>ترانه‌ای ثبت نشده</div>';
  nav('album',alb.t);
}

// SONG
function openSong(albId,idx){
  const data=getData(cur.artist.id);
  const all=[...(data.albums||[]),...(data.compilations||[]),...(data.concerts||[])];
  const alb=all.find(x=>x.id===albId);
  if(!alb)return;
  renderSong(alb.s[idx]);
}

      <button class="stab2" onclick="swtab(1,this)">داستان</button>
      <button class="stab2" onclick="swtab(2,this)">متن ترانه</button>
      <button class="stab2" onclick="swtab(3,this)">نت</button>
    </div>`;
  document.getElementById('sngpanels').innerHTML=`
    <div class="spanel2 active" id="s0">
      <div class="irow"><span class="ilbl">خواننده</span><span class="ival">${a.full}</span></div>
      <div class="irow"><span class="ilbl">سال</span>${v(s.y)}</div>
      <div class="irow"><span class="ilbl">شاعر / ترانه‌سرا</span>${v(s.p)}</div>
      <div class="irow"><span class="ilbl">آهنگساز</span>${v(s.c)}</div>
      <div class="irow"><span class="ilbl">تنظیم‌کننده</span>${v(s.r)}</div>
      ${s.film?`<div class="irow"><span class="ilbl">نام فیلم</span><span class="ival">${s.film}</span></div>`:''}
      ${s.dir?`<div class="irow"><span class="ilbl">کارگردان</span><span class="ival">${s.dir}</span></div>`:''}
      ${s.n?`<div class="irow"><span class="ilbl">توضیح</span><span class="ival">${s.n}</span></div>`:''}
    </div>
    <div class="spanel2" id="s1">${s.story?`<p class="story">${s.story}</p>`:'<div class="nodata"><div class="nodata-ic">📖</div>داستانی ثبت نشده</div>'}</div>
    <div class="spanel2" id="s2">${s.lyrics?`<pre class="lyrics">${s.lyrics}</pre>`:'<div class="nodata"><div class="nodata-ic">🎵</div>متن هنوز اضافه نشده</div>'}</div>
    <div class="spanel2" id="s3"><div class="nodata"><div class="nodata-ic">🎼</div>نت هنوز اضافه نشده</div></div>`;
  nav('song',s.t);
}

function swtab(i,btn){
  const a=cur.artist;
  document.querySelectorAll('.stab2').forEach(t=>{t.classList.remove('active');t.style.background='';t.style.borderColor='';t.style.color='';});
  btn.classList.add('active');btn.style.background=a.l;btn.style.borderColor=a.l;btn.style.color='#000';
  [0,1,2,3].forEach(j=>{const p=document.getElementById('s'+j);if(p)p.classList.toggle('active',j===i);});
}

// NAV
function nav(page,title){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active','fade');
  document.getElementById('nt').textContent=title;
  document.getElementById('nb').classList.add('show');
  stk.push(page);
  window.scrollTo(0,0);
}

function goBack(){
  stk.pop();
  const prev=stk[stk.length-1];
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+prev).classList.add('active');
  if(prev==='home'){document.getElementById('nt').textContent='موسیقی جاودان';document.getElementById('nb').classList.remove('show');}
  else if(prev==='artist')document.getElementById('nt').textContent=cur.artist?.name||'';
  else if(prev==='album')document.getElementById('nt').textContent=cur.album?.t||'';
  window.scrollTo(0,0);
}

renderHome();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
